[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yuumi-py"
version = "0.1.0"
description = "Python SDK for Yuumi IPC protocol v2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "msgpack>=1.0.7",
]

[tool.setuptools]
packages = ["yuumi"]
